[package]
name = "upload-sorter"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"

[dependencies]
anyhow = "1"
fs2 = "0.4"
lofty = "0.25.5"
notify = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
walkdir = "2"
zip = { version = "9.1.3", default-features = false, features = ["deflate", "bzip2", "zstd"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
